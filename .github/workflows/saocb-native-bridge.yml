name: Build SAO-CB Native Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'client_patch/**'
      - '.github/workflows/saocb-native-bridge.yml'

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n1)"
          test -n "$SDKMANAGER"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android NDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Build bridge SO and DEX
        shell: bash
        run: |
          set -euo pipefail
          sh client_patch/build_bridge.sh
          sha256sum \
            client_patch/build/cmake-arm64-v8a/libsaocb_bridge.so \
            client_patch/build/dex/classes.dex \
            | tee client_patch/build/SHA256SUMS.txt

      - name: Host regression tests
        shell: bash
        run: |
          set -euo pipefail
          sh client_patch/bridge/native/test_request_registry.sh
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Iclient_patch/bridge/native \
            client_patch/bridge/native/test_fetch_user_all_url.cpp \
            -o /tmp/test_fetch_user_all_url
          /tmp/test_fetch_user_all_url

      - name: Upload bridge payload
        uses: actions/upload-artifact@v4
        with:
          name: SAOCB-fetchUserAll-bridge-arm64
          path: |
            client_patch/build/cmake-arm64-v8a/libsaocb_bridge.so
            client_patch/build/dex/classes.dex
            client_patch/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
