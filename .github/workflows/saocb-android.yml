name: Build SAO-CB Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'saocb_android/**'
      - '.github/workflows/saocb-android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p saocb_android :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SAO-CB-Reborn-Android-V1
          path: saocb_android/app/build/outputs/apk/debug/app-debug.apk
